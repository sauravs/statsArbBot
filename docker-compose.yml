# statsArbBot — local development stack
#
# Usage:
#   cp .env.example .env          # fill in secrets (or use the existing dev .env)
#   docker compose up --build
#
# Services:
#   postgres  — PostgreSQL 16 (statsarb DB)
#   api       — FastAPI + Prisma (port 8000)
#   ui        — Next.js dashboard (port 3000)

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: statsarb
      POSTGRES_USER: statsarb
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    # Bind to localhost only — the host port is for local/debug access (psql, SSH
    # tunnel); nothing external should reach Postgres. On a public box this keeps
    # 5432 off all public interfaces regardless of the security group.
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "statsarb"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file: .env
    environment:
      # Override host DATABASE_URL to reach the postgres service on the compose network.
      # connection_limit/pool_timeout raise Prisma's client pool above its default of
      # 5 (issue #168): a heavy walk-forward backtest (e.g. Hyperliquid, 180 markets,
      # many windows) runs as a long background task while the UI polls + APScheduler
      # sim ticks + the live-scan cron all share the pool; 5 starved under contention
      # and the backtest FAILED with a pool-acquire timeout. Postgres allows 100
      # connections (11 in use), so 20 is safe headroom. Quoted: `&`/`?` are YAML-special.
      DATABASE_URL: "postgresql://statsarb:${POSTGRES_PASSWORD}@postgres:5432/statsarb?connection_limit=20&pool_timeout=30"
    # Localhost only — the UI reaches the API over the compose network
    # (API_URL=http://api:8000), so the host port is just for local/debug use.
    ports:
      - "127.0.0.1:8000:8000"
    command: >
      sh -c "prisma generate --schema prisma/schema.prisma &&
             prisma migrate deploy --schema prisma/schema.prisma &&
             uvicorn app:app --host 0.0.0.0 --port 8000"

  ui:
    build:
      context: ./ui
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - api
    environment:
      # Pass only what the Next.js tier needs — do NOT inject backend secrets
      # (dYdX key, Telegram token, DATABASE_URL) into the UI container.
      # Values are interpolated from the project .env by Compose.
      DASHBOARD_PASSWORD: ${DASHBOARD_PASSWORD}
      DASHBOARD_JWT_SECRET: ${DASHBOARD_JWT_SECRET}
      # Server-side proxy reaches the API service on the compose network.
      API_URL: http://api:8000
      NODE_ENV: production
    # Localhost only — in production nginx (on the host) reverse-proxies
    # 443 → 127.0.0.1:3000; the UI port is never exposed publicly itself.
    ports:
      - "127.0.0.1:3000:3000"

volumes:
  postgres_data:

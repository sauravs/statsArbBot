name: CI

# Quality gate for every change. Runs on PRs into the protected branches and on
# direct pushes to them. Branch protection requires these jobs to pass before a
# merge into `main` or `production` is allowed (see docs/DEPLOYMENT.md).
on:
  pull_request:
    branches: [main, production]
  push:
    branches: [main, production]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend · pytest
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: statsarb
          POSTGRES_PASSWORD: statsarb_ci
          POSTGRES_DB: statsarb
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U statsarb"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Several tests need a real DB (the same ones that fail on a bare host).
      DATABASE_URL: postgresql://statsarb:statsarb_ci@localhost:5432/statsarb
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Prisma generate + migrate
        run: |
          prisma generate --schema prisma/schema.prisma
          prisma migrate deploy --schema prisma/schema.prisma

      - name: Run tests
        run: pytest -q

  frontend:
    name: frontend · typecheck + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

  e2e:
    name: e2e · playwright
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      # A throwaway .env for the ephemeral runner. Compose reads `.env` directly
      # (the api service declares `env_file: .env`), so the stack has to be given
      # one. Three properties matter:
      #   ENVIRONMENT=testnet     — never mainnet, even though nothing here trades.
      #   SCAN_DATA_SOURCE=fake   — the synthetic demo markets the suite asserts on.
      #   no TELEGRAM_* at all    — with Telegram credentials the runtime installs
      #                             the Telegram approval gate, which holds every
      #                             entry signal for a human and makes the
      #                             live-trading path unrunnable. Omitting them
      #                             keeps the auto-approve default.
      # The dYdX values are dummies: in fake mode no venue call is ever made.
      - name: Write a throwaway .env for the stack
        run: |
          cat > .env <<'EOF'
          ENVIRONMENT=testnet
          SCAN_DATA_SOURCE=fake
          DASHBOARD_PASSWORD=123456
          DASHBOARD_JWT_SECRET=ci-throwaway-jwt-signing-key-not-a-secret
          POSTGRES_PASSWORD=statsarb_ci
          DATABASE_URL=postgresql://statsarb:statsarb_ci@postgres:5432/statsarb
          API_URL=http://api:8000
          DYDX_WALLET_API_KEY=ci-dummy
          DYDX_PRIVATE_KEY=ci-dummy
          EOF

      - name: Start the stack
        run: docker compose up -d --build

      # The api container runs prisma migrate deploy before uvicorn, so "healthy"
      # genuinely means migrated-and-serving rather than just process-started.
      - name: Wait for the stack
        run: |
          for i in $(seq 1 60); do
            if curl -sf -o /dev/null http://localhost:3000/login \
               && curl -sf -H "X-API-Key: 123456" http://localhost:8000/api/system/health \
                  | grep -q '"status":"ok"'; then
              echo "stack ready after ~$((i * 5))s"; exit 0
            fi
            sleep 5
          done
          echo "::error::stack did not become ready in 5 minutes"
          docker compose ps
          docker compose logs --tail=200
          exit 1

      # The OHLCV cache is only ever written by the historical ingest, which talks
      # to a real exchange indexer — so a fresh database has none and the Data
      # inventory has nothing to report. Seed synthetic bars instead of weakening
      # the spec to tolerate an empty cache, which would leave the feature ungated.
      - name: Seed the OHLCV cache
        run: |
          docker compose exec -T postgres \
            psql -U statsarb -d statsarb -v ON_ERROR_STOP=1 \
            < ui/e2e/fixtures/seed-ohlcv.sql

      - name: Install dependencies
        working-directory: ui
        run: npm ci

      - name: Install Playwright browser
        working-directory: ui
        run: npx playwright install --with-deps chromium

      - name: Run e2e
        working-directory: ui
        env:
          DASHBOARD_PASSWORD: "123456"
        run: npm run test:e2e

      - name: Stack logs on failure
        if: failure()
        run: docker compose logs --tail=300

      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            ui/test-results
            ui/playwright-report
          retention-days: 7

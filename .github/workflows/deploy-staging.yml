name: Deploy · staging

# Auto-deploys the integration trunk (`main`) to the STAGING environment.
# Topology matches docs/DEPLOYMENT.md: a single host running the committed
# docker-compose stack (postgres + api + ui). Images are built once here and the
# host just pulls them.
#
# SKELETON: image build+push works out of the box (GHCR via GITHUB_TOKEN); the
# host-deploy step is gated behind repo variable `DEPLOY_STAGING == 'true'` and
# is a safe no-op until you add the SSH secrets. See docs/CICD.md.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-staging
  cancel-in-progress: false

permissions:
  contents: read
  packages: write          # push images to GHCR

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository }}

jobs:
  build:
    name: build + push images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build & push backend + ui
        run: |
          for svc in backend ui; do
            img="${IMAGE_PREFIX}-${svc}"
            docker build -t "$img:${{ github.sha }}" -t "$img:staging" "./$svc"
            docker push "$img:${{ github.sha }}"
            docker push "$img:staging"
          done

  deploy:
    name: deploy → staging host
    needs: build
    runs-on: ubuntu-latest
    environment: staging     # GitHub Environment holds staging secrets/vars
    if: ${{ vars.DEPLOY_STAGING == 'true' }}
    steps:
      # TODO: deploy to the staging host. With the docker-compose topology this is
      # an SSH in + `docker compose pull && docker compose up -d` (the api
      # container applies `prisma migrate deploy` on start — fine for staging).
      # Requires secrets: STAGING_SSH_HOST / STAGING_SSH_USER / STAGING_SSH_KEY.
      # e.g. appleboy/ssh-action@v1 running:
      #   cd /opt/statsarb/app && git pull && docker compose pull && docker compose up -d
